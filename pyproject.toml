[build-system]
requires = ["setuptools>=61.0,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc"
version = "2.0.0"
description = "Spectral Pattern Analysis for ROI Classification"
requires-python = "==3.11.*"
dependencies = [
    # --- Core scientific stack ---
    # Keep the base environment compatible with the supported PyTorch extra;
    # PyTorch 2.2 is compiled against the NumPy 1.x C API.
    "numpy>=1.24,<2",
    "scipy>=1.7.0",
    "pandas>=1.3.0,<3.0",
    "scikit-image>=0.19.0",
    "matplotlib>=3.3.0",
    "astropy>=5.0",

    # --- Computer vision ---
    "opencv-python>=4.5.0",

    # --- MillionConcepts stack ---
    # These are not on PyPI, but their public GitHub repositories can be
    # installed over HTTPS without requiring an SSH key in CI.
    # uv lock records the exact commit for reproducibility.
    "asdf @ git+https://github.com/MillionConcepts/asdf.git",
    "pdr @ git+https://github.com/MillionConcepts/pdr.git",
    "silencio @ git+https://github.com/MillionConcepts/silencio.git",
    "pretty-plot @ git+https://github.com/MillionConcepts/pretty-plot.git",
    "marslab @ git+https://github.com/MillionConcepts/marslab.git",
    "rapid>=0.0.3",

    # --- Utilities ---
    "PyYAML>=6.0",
    "fs>=2.4.0",
    "rich>=12.0.0",
    "boto3>=1.20.0",
    "gspread>=5.0.0",
    "google-api-python-client>=2.0.0",
    "sh==0.108",
    # setuptools>=81 breaks several MillionConcepts packages - pin it out
    "setuptools<81",
]

[project.optional-dependencies]
# Segmentation and spectral clustering. Consumers that only need SPARC's data
# loading, ROI editing, spectra, and file I/O can omit this extra.
algorithm = [
    "scikit-learn>=1.0.0",
    "kneed>=0.7.0",
    "psutil>=5.8.0",
    # torch 2.2.2 is the last version with wheels for Intel Mac (macosx_x86_64).
    "torch>=2.0.0,<2.3.0",
    "torchvision>=0.15.0,<0.18.0",
    "segment-anything>=1.0",
]

# Notebook development dependencies
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparc = ["resources/*.sel", "resources/*.csv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Ensure the lockfile covers all supported platforms so it works on both
# Intel Mac, Apple Silicon Mac, and Windows x86_64.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
